<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DCLC Elementary Portal</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#F5F3EE;color:#1B2733}
button,select,input,textarea{font-family:inherit;font-size:14px}
button{cursor:pointer}
.hidden{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding:12px}
.shell{background:#fff;border:1px solid #E9E3D6;border-radius:14px;overflow:hidden}
.hdr{padding:20px 24px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid #E3E8EE}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:10px;background:#2E4057;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.brand h1{margin:0;font-size:18px;color:#2E4057}
.brand .sub{font-size:13px;color:#5A6B7B}
.who{margin-left:auto;font-size:13px;color:#3E4C59;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;background:#fff;border:1px solid #CBD5DF;border-radius:10px;padding:8px 14px;min-height:44px;font-weight:600;color:#1B2733}
.pill.on{background:#2E4057;color:#fff;border-color:#2E4057}
.icon{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;background:#fff;border:1px solid #CBD5DF;border-radius:10px;color:#2E4057}
.icon.on{background:#2E4057;color:#fff;border-color:#2E4057}
.primary{background:#2E4057;color:#fff;border:0;border-radius:10px;padding:8px 18px;min-height:44px;font-weight:700}
.secondary{background:#fff;border:1px solid #2E4057;color:#2E4057;border-radius:10px;padding:8px 18px;min-height:44px;font-weight:700}
.danger{background:#fff;border:1px solid #A4262C;color:#A4262C;border-radius:10px;padding:8px 18px;min-height:44px;font-weight:700}
.link{background:none;border:0;color:#1F3A5F;text-decoration:underline;padding:6px;min-height:36px;font-weight:700}
.sync{background:#E3F4DA;border:1px solid #B8DDA3;color:#2F5D1A;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.sync.demo{background:#FBEBCB;border-color:#E3C98D;color:#4D3000}
.body{display:flex;flex-wrap:wrap;min-height:700px}
.side{flex:1 1 280px;max-width:340px;min-width:0;padding:20px;border-right:1px solid #E3E8EE;display:flex;flex-direction:column;gap:16px}
.main{flex:3 1 520px;min-width:0;padding:24px;display:flex;flex-direction:column;gap:18px}
.fh{font-size:11px;font-weight:700;letter-spacing:.06em;color:#5A6B7B;margin-bottom:6px}
.field{width:100%;min-height:44px;border:1px solid #CBD5DF;border-radius:10px;padding:0 12px;background:#fff;color:#1B2733}
textarea.field{padding:10px;min-height:72px}
.fc{display:inline-flex;align-items:center;border:1px solid #CBD5DF;background:#fff;color:#1B2733;border-radius:999px;padding:6px 12px;min-height:36px;font-size:13px;font-weight:600;margin:0 6px 6px 0}
.fc.on{background:#2E4057;color:#fff;border-color:#2E4057}
.srow{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;color:#1B2733;background:none;border:0;width:100%;text-align:left}
.srow.sel{background:#EAF1FA}
.srow:hover{background:#F2F6FB}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.sn{font-size:15px;font-weight:700}
.ss{font-size:12px;color:#5A6B7B;margin-top:2px}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;line-height:1.35;margin:0 4px 4px 0;white-space:nowrap}
.t1{background:#DDF1EE;color:#0E5C52}.t2{background:#DCE9F8;color:#123F73}.mon{background:#FBEBCB;color:#6B4300}
.dys{background:#E9E3F6;color:#3F2A78}.sp{background:#FBE2E8;color:#7A1F3D}.none{background:#ECEFF2;color:#3E4C59}
.grp{border:1px solid #9FB3C8;color:#1F3A5F;background:#fff;font-weight:600}
.r-admin{background:#2E4057;color:#fff}.r-int{background:#DCE9F8;color:#123F73}.r-prin{background:#FBEBCB;color:#6B4300}.r-teach{background:#DDF1EE;color:#0E5C52}
.tabs{border-bottom:1px solid #E3E8EE;display:flex;flex-wrap:wrap;gap:2px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;min-height:44px;font-weight:700;color:#3E4C59}
.tab.on{color:#2E4057;border-bottom-color:#2563A8}
.row{display:flex;flex-wrap:wrap;gap:16px}
.card{background:#fff;border:1px solid #E3E8EE;border-radius:12px;padding:18px;flex:1 1 280px;min-width:0}
.card h2{margin:0 0 12px;font-size:16px;color:#2E4057;border-bottom:2px solid #E3E8EE;padding-bottom:8px}
.card.muted{background:#FAFAF8;color:#5A6B7B}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #EEF2F6;font-size:14px}
.kv span:first-child{color:#4A5B6B}.kv span:last-child{text-align:right;font-weight:700}
.empty{color:#5A6B7B;font-size:14px;margin:4px 0}
.note{padding:8px 0;border-bottom:1px solid #EEF2F6;font-size:14px}
.small{font-size:12px;color:#4A5B6B;margin-top:2px}
.tiles{display:flex;flex-wrap:wrap;gap:12px}
.tile{flex:1 1 150px;background:#fff;border:1px solid #E3E8EE;border-radius:12px;padding:14px 16px}
.tn{font-size:30px;font-weight:700;color:#2E4057;line-height:1.1}.tl{font-size:13px;color:#4A5B6B;margin-top:4px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#4A5B6B;background:#F1F4F8;padding:10px 12px;border-bottom:2px solid #E3E8EE}
td{padding:11px 12px;border-bottom:1px solid #EEF2F6;vertical-align:top}
.banner{border-radius:10px;padding:12px 16px;font-size:14px;background:#EAF1FA;border:1px solid #C5D7EC;color:#1F3A5F}
.banner.warn{background:#FBEBCB;border-color:#E3C98D;color:#4D3000}
.banner.ok{background:#E3F4DA;border-color:#B8DDA3;color:#2F5D1A}
.banner.err{background:#FBE3E4;border-color:#E8B4B7;color:#7A1A1F}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:#4A5B6B}
.fl .field{font-weight:400}
.cols{display:flex;flex-wrap:wrap;gap:12px}.cols>*{flex:1 1 200px;min-width:0}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;min-height:36px;font-weight:400;color:#1B2733}
.chk input{width:18px;height:18px}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#6B7886;padding:40px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login .box{background:#fff;border:1px solid #E3E8EE;border-radius:16px;width:100%;max-width:380px;padding:32px;text-align:center}
.login .avatar{width:64px;height:64px;border-radius:50%;background:#2E4057;color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.login h1{margin:0;font-size:22px;color:#2E4057}.login p{margin:4px 0 20px;color:#5A6B7B;font-size:14px}
.login .field{text-align:center;margin-bottom:12px}.login .primary{width:100%}
.overlay{position:fixed;inset:0;background:rgba(27,39,51,.5);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:24px;display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font-size:18px;color:#2E4057}
.modal .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.accrow{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}.accrow>*{flex:1 1 140px;min-width:0}.accrow>button{flex:0 0 auto}
.sr{position:absolute;left:-9999px}
@media(max-width:700px){.side{max-width:none;border-right:0;border-bottom:1px solid #E3E8EE}.main{padding:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<script>
'use strict';
/* ===== CONFIG: paste your deployed Apps Script web app URL (ends in /exec) between the quotes ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbzHBgT9-hNpBDGCrAr8tnWNBzDLb542t2bigo8PlGRM1e757bdYc6SJAyTEqeOoIHjq/exec';
/* ================================================================================================ */
const DEMO = API_URL.indexOf('PASTE_') === 0;   // with no URL set, the page runs on fake sample data
const IDLE_MS = 30 * 60 * 1000;

const GRADES = ['K3','K4','K5','1st','2nd','3rd','4th','5th'];
const TIER_LABEL = { tier1:'Tier 1', tier2:'Tier 2', monitor:'Monitor', none:'No tier' };
const TIER_CLASS = { tier1:'t1', tier2:'t2', monitor:'mon', none:'none' };
const TYPE_LABEL = { 'push-in':'Push-in', 'pull-out':'Pull-out', 'dyslexia':'Dyslexia' };
const ROLE_LABEL = { admin:'Admin', interventionist:'Interventionist', principal:'Principal', teacher:'Teacher' };
const ROLE_CLASS = { admin:'r-admin', interventionist:'r-int', principal:'r-prin', teacher:'r-teach' };
const SCOPE_LABEL = { tiered:'Students with a tier', dyslexia:'Dyslexia students', all:'All students' };
const TABS = ['Overview','Teacher Information','Accommodations','Progress Monitoring','Testing History','Documentation','Grade History'];
const COMING = {
  'Progress Monitoring':'Coming in Phase 3: DRA reading levels, NWEA, and intervention data.',
  'Testing History':'Coming in Phase 4: appears once the elementary testing calendar is running.',
  'Documentation':'Coming in Phase 3: notes and meeting logs.',
  'Grade History':'Coming in Phase 3: pulled from RenWeb.'
};
const VIEW_COMING = {
  'testing-calendar':['Testing Calendar','Coming in Phase 4: the elementary testing calendar.'],
  'testing-summary':['Testing Summary','Coming in Phase 4: testing prep and accommodation summary.'],
  'reports':['Reports','Coming in Phase 3: progress and trend reports.']
};
const PALETTE = [['#E3EEF8','#1F4E87'],['#DFF2EC','#0E5C52'],['#FCEBD7','#7A4A0A'],['#ECE7F7','#3F2A78']];

const state = {
  token: null, user: null, data: null, view: 'home', selectedId: null, tab: 'Overview',
  filters: { q:'', tier:'', dyslexia:false, speech:false, group:'', grade:'' },
  syncedAt: null, notice: null, loginMsg: '', logins: null
};

/* ---------- helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const role = () => state.user ? state.user.role : '';
const isAdmin = () => role() === 'admin';
const isTeacher = () => role() === 'teacher';
const lastName = n => String(n).trim().split(/\s+/).pop().toLowerCase();
const initials = n => { const p = String(n).trim().split(/\s+/); return ((p[0]||'')[0] || '') + ((p.length > 1 ? p[p.length-1] : '')[0] || ''); };
const palette = n => PALETTE[[...String(n)].reduce((a, c) => a + c.charCodeAt(0), 0) % PALETTE.length];
const fmtDate = d => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ''); return m ? `${+m[2]}/${+m[3]}/${m[1]}` : ''; };
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const timeStr = d => d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
const groupLabel = g => `${TYPE_LABEL[g.type] || g.type} · ${g.name}`;
const sortStudents = list => list.slice().sort((a, b) => lastName(a.name).localeCompare(lastName(b.name)) || a.name.localeCompare(b.name));
const groupById = id => (state.data.groups || []).find(g => g.id === id);
const teacherById = id => (state.data.teachers || []).find(t => t.id === id);
const student = () => state.data && state.data.students.find(s => s.id === state.selectedId);

function tierSummary(s) {
  const parts = [s.grade];
  if (s.tier === 'none' && s.dyslexia && !s.speech) parts.push('Dyslexia only');
  else {
    parts.push(TIER_LABEL[s.tier]);
    if (s.dyslexia) parts.push('Dyslexia');
    if (s.speech) parts.push('Speech');
  }
  return parts.join(' · ');
}
function flagChips(s) {
  let h = '';
  if (s.tier !== 'none') h += `<span class="chip ${TIER_CLASS[s.tier]}">${TIER_LABEL[s.tier]}</span>`;
  if (s.dyslexia) h += '<span class="chip dys">Dyslexia</span>';
  if (s.speech) h += '<span class="chip sp">Speech</span>';
  if (s.tier === 'none' && !s.dyslexia && !s.speech) h += '<span class="chip none">No tier</span>';
  return h;
}
function seenBy(s) {
  // Same rule the server uses to decide which interventionist sees a student.
  const dysGroup = (s.groupIds || []).some(id => { const g = groupById(id); return g && g.type === 'dyslexia'; });
  return (state.data.staff || []).filter(p => p.scope === 'all' || (p.scope === 'dyslexia' ? (s.dyslexia || dysGroup) : s.tier !== 'none'))
    .map(p => lastName(p.name).replace(/^./, c => c.toUpperCase())).join(', ');
}

/* ---------- API ---------- */
async function api(action, payload) {
  const body = Object.assign({ action, token: state.token }, payload || {});
  if (DEMO) return demoApi(action, body);
  try {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
    return await res.json();
  } catch (e) {
    return { error: 'Could not reach the server. Check your connection and try again.' };
  }
}
function handleAuthError(r) {
  if (r && r.error === 'auth') { signOutLocal('Your session expired. Please sign in again.'); return true; }
  return false;
}

/* ---------- session ---------- */
function saveSession() { try { sessionStorage.setItem('elem_session', JSON.stringify({ token: state.token, user: state.user })); } catch (e) {} }
function signOutLocal(msg) {
  state.token = null; state.user = null; state.data = null; state.selectedId = null; state.view = 'home';
  state.loginMsg = msg || '';
  try { sessionStorage.removeItem('elem_session'); } catch (e) {}
  closeModal(); render();
}
async function signOut() { const t = state.token; if (t) await api('logout'); signOutLocal(''); }
let idleTimer = null;
function bumpIdle() { clearTimeout(idleTimer); if (state.token) idleTimer = setTimeout(() => signOutLocal('You were signed out after 30 minutes of inactivity.'), IDLE_MS); }
['click','keydown'].forEach(ev => document.addEventListener(ev, bumpIdle, true));

async function doLogin() {
  const input = $('codeInput'); const code = input.value.trim();
  if (!code) { state.loginMsg = 'Enter your access code.'; render(); return; }
  $('loginBtn').disabled = true; $('loginBtn').textContent = 'Signing in...';
  const r = await api('login', { code });
  if (r.error) { state.loginMsg = r.message || (r.error === 'Invalid code' ? 'That code did not work.' : r.error); render(); return; }
  state.token = r.token; state.user = r.user; state.loginMsg = ''; state.view = 'home'; state.selectedId = null;
  saveSession();
  await loadAll(true);
}
async function loadAll(showErr) {
  const r = await api('getAll');
  if (handleAuthError(r)) return;
  if (r.error) { state.notice = { type:'err', text: r.error }; render(); return; }
  state.data = r; state.user = r.user; state.syncedAt = new Date();
  if (state.selectedId && !state.data.students.some(s => s.id === state.selectedId)) state.selectedId = null;
  bumpIdle(); render();
}

/* ---------- rendering ---------- */
function render() {
  const app = $('app');
  if (!state.token || !state.data) { app.innerHTML = loginHtml(); const i = $('codeInput'); if (i) i.focus(); return; }
  app.innerHTML = `<div class="wrap"><div class="shell">${headerHtml()}${bodyHtml()}</div></div>`;
}

function loginHtml() {
  const demoNote = DEMO ? `<div class="banner warn" style="margin-top:16px;text-align:left"><b>Demo mode.</b> No server is connected, so this runs on fake sample data. Try codes: <b>demo-admin</b>, <b>demo-wendy</b>, <b>demo-abby</b>, <b>demo-principal</b>, <b>demo-teacher</b>.</div>` : '';
  return `<div class="login"><div class="box">
    <div class="avatar"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8z"/></svg></div>
    <h1>DCLC Elementary Portal</h1><p>Dallas Christian Learning Center</p>
    <label class="sr" for="codeInput">Access code</label>
    <input class="field" id="codeInput" type="password" placeholder="Enter access code" autocomplete="off">
    ${state.loginMsg ? `<div class="banner err" role="alert" style="margin-bottom:12px">${esc(state.loginMsg)}</div>` : ''}
    <button class="primary" id="loginBtn" data-act="login">Sign in</button>${demoNote}
  </div></div>`;
}

function headerHtml() {
  const r = role();
  const pill = (v, label) => `<button class="pill ${state.view === v ? 'on' : ''}" data-act="view" data-v="${v}">${label}</button>`;
  const syncLabel = DEMO ? 'Demo mode' : `Synced ${state.syncedAt ? timeStr(state.syncedAt) : ''}`;
  return `<header class="hdr">
    <div class="brand"><div class="logo">EL</div><div><h1>DCLC Elementary Portal</h1><div class="sub">Learning Support · K3 to 5th</div></div>
      <div class="who"><span><b>${esc(state.user.name)}</b> · ${esc(ROLE_LABEL[r])}</span><button class="link" data-act="signout">Sign out</button></div></div>
    <div class="nav">
      <button class="sync ${DEMO ? 'demo' : ''}" data-act="refresh" title="Refresh data">${syncLabel}</button>
      ${isAdmin() ? `<button class="icon ${state.view === 'access' ? 'on' : ''}" data-act="view" data-v="access" aria-label="Access and roles"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/></svg></button>` : ''}
      ${pill('overview','Overview')}${pill('testing-calendar','Testing calendar')}${pill('testing-summary','Testing summary')}
      ${r !== 'teacher' ? pill('reports','Reports') : ''}
      ${isAdmin() ? pill('logins','Login report') : ''}
      ${isAdmin() ? `<button class="primary" data-act="addStudent">+ Add student</button>` : ''}
    </div></header>`;
}

function bodyHtml() {
  const v = state.view;
  const notice = state.notice ? `<div class="banner ${state.notice.type}" role="status">${esc(state.notice.text)}</div>` : '';
  if (v === 'home') return `<div class="body">${sideHtml()}<section class="main">${notice}${student() ? profileHtml(student()) : emptyHtml()}</section></div>`;
  let inner;
  if (v === 'overview') inner = overviewHtml();
  else if (v === 'access') inner = accessHtml();
  else if (v === 'logins') inner = loginsHtml();
  else { const c = VIEW_COMING[v]; inner = `<div class="card muted"><h2>${esc(c[0])}</h2><p class="empty">${esc(c[1])}</p></div>`; }
  return `<div class="body"><section class="main" style="flex-basis:100%">${notice}${inner}</section></div>`;
}

function emptyHtml() {
  const n = state.data.students.length;
  const msg = n ? 'Select a student' + (isAdmin() ? ' or add a new one' : '') : (isAdmin() ? 'No students yet. Use "+ Add student" to start the roster.' : 'No students are assigned to you yet.');
  return `<div class="empty-state"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#B7C0CA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M16.5 14.2c2.6 0 4.5 2 4.5 4.8"/></svg><div>${esc(msg)}</div></div>`;
}

/* sidebar */
function filteredStudents() {
  const f = state.filters; const q = f.q.trim().toLowerCase();
  return sortStudents(state.data.students.filter(s =>
    (!q || s.name.toLowerCase().includes(q)) && (!f.grade || s.grade === f.grade) && (!f.tier || s.tier === f.tier) &&
    (!f.dyslexia || s.dyslexia) && (!f.speech || s.speech) && (!f.group || (s.groupIds || []).includes(f.group))));
}
function listHtml() {
  const list = filteredStudents();
  if (!list.length) return '<div class="empty" style="padding:8px 12px">No matching students.</div>';
  return list.map(s => { const p = palette(s.name); return `<button class="srow ${s.id === state.selectedId ? 'sel' : ''}" data-act="select" data-id="${esc(s.id)}"><span class="av" style="background:${p[0]};color:${p[1]}">${esc(initials(s.name))}</span><span><div class="sn">${esc(s.name)}</div><div class="ss">${esc(tierSummary(s))}</div></span></button>`; }).join('');
}
function sideHtml() {
  const f = state.filters;
  const chip = (key, val, label) => `<button class="fc ${f[key] === val ? 'on' : ''}" data-act="filter" data-k="${key}" data-v="${val}">${label}</button>`;
  const groups = (state.data.groups || []);
  return `<aside class="side">
    <div><label class="sr" for="q">Search by name</label><input class="field" id="q" type="text" placeholder="Search by name..." value="${esc(f.q)}" autocomplete="off"></div>
    <div><div class="fh">GRADE</div><select class="field" id="gradeSel" aria-label="Grade"><option value="">All grades</option>${GRADES.map(g => `<option ${f.grade === g ? 'selected' : ''}>${g}</option>`).join('')}</select></div>
    <div><div class="fh">SERVICE TIER</div>${chip('tier','','All')}${chip('tier','tier1','Tier 1')}${chip('tier','tier2','Tier 2')}${chip('tier','monitor','Monitor')}</div>

  login: doLogin,
  signout: signOut,
  refresh: async () => { state.notice = null; await loadAll(); },
  view: el => { state.view = el.dataset.v; state.notice = null; if (state.view === 'logins') state.logins = null; render(); },
  select: el => { state.selectedId = el.dataset.id; state.tab = 'Overview'; state.notice = null; state.view = 'home'; render(); },
  tab: el => { state.tab = el.dataset.t; render(); },
  filter: el => { state.filters[el.dataset.k] = el.dataset.v; render(); },
  toggleFlag: el => { state.filters[el.dataset.k] = !state.filters[el.dataset.k]; render(); },
  addStudent: () => studentModal(null),
  editStudent: () => studentModal(student()),
  saveStudent: async () => {
    const editing = document.querySelector('#modalRoot [data-act="archiveStudent"]') ? student() : null;
    const r = await api('saveStudent', { student: collectStudent(editing) });
    if (r && r.ok) { state.selectedId = r.student.id; state.view = 'home'; }
    await afterSave(r, 'Student saved.');
  },
  archiveStudent: async () => {
    if (!confirm('Remove this student from the portal? Their record is archived, not erased.')) return;
    const r = await api('archiveStudent', { id: state.selectedId });
    if (r && r.ok) state.selectedId = null;
    await afterSave(r, 'Student removed from the portal.');
  },
  editAcc: () => accModal(student()),
  addAccRow: () => { $('accRows').insertAdjacentHTML('beforeend', window._accRow({})); },
  removeAccRow: el => el.closest('.accrow').remove(),
  saveAcc: async () => {
    const rows = [...document.querySelectorAll('#accRows .accrow')].map(r => ({
      id: r.querySelector('[name=aId]').value, name: r.querySelector('[name=aName]').value, appliesTo: r.querySelector('[name=aApplies]').value, source: r.querySelector('[name=aSource]').value }));
    const r = await api('saveStudent', { student: Object.assign({}, student(), { accommodations: rows }) });
    await afterSave(r, 'Accommodations saved.');
  },
  logUse: async () => {
    const r = await api('logAccommodationUse', { studentId: state.selectedId, accommodationId: val('logAcc'), date: val('logDate'), result: val('logResult'), note: val('logNote') });
    if (handleAuthError(r)) return;
    if (r.error) { state.notice = { type:'err', text: r.error }; render(); return; }
    state.notice = { type:'ok', text:'Logged. Thank you.' }; await loadAll();
  },
  addGroup: () => groupModal(null),
  editGroup: el => { state.editingGroup = el.dataset.id; groupModal(groupById(el.dataset.id)); },
  saveGroup: async () => {
    const editing = document.querySelector('[data-act="archiveGroup"]') ? state.editingGroup : '';
    const r = await api('saveGroup', { group: { id: editing || undefined, name: val('gName'), type: val('gType'), staffName: val('gStaff'), timeBlock: val('gTime') } });
    await afterSave(r, 'Group saved.');
  },
  archiveGroup: async () => {
    if (!confirm('Remove this group? Students will be taken out of it.')) return;
    await afterSave(await api('archiveGroup', { id: state.editingGroup }), 'Group removed.');
  },
  addUser: () => { state.editingUser = null; userModal(null); },
  editUser: el => { state.editingUser = el.dataset.id; userModal((state.data.users || []).find(u => u.id === el.dataset.id)); },
  saveUser: async () => {
    const r = await api('saveUser', { user: { id: state.editingUser || undefined, name: val('uName'), email: val('uEmail'), role: val('uRole'), scope: val('uScope'), code: val('uCode') } });
    if (r && r.ok && r.code) state.codeNotice = { name: r.user.name, code: r.code };
    await afterSave(r, '');
  },
  removeUser: async el => {
    if (!confirm('Deactivate this person? They will be signed out and can no longer sign in.')) return;
    await afterSave(await api('removeUser', { id: el.dataset.id }), 'Person deactivated.');
  },
  dismissCode: () => { state.codeNotice = null; render(); },
  closeModal: closeModal
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'overlay') { if (e.target === el) closeModal(); return; }
  const fn = actions[el.dataset.act]; if (fn) fn(el);
});
document.addEventListener('input', e => { if (e.target.id === 'q') { state.filters.q = e.target.value; refreshList(); } });
document.addEventListener('change', e => {
  if (e.target.id === 'gradeSel') { state.filters.grade = e.target.value; render(); }
  if (e.target.id === 'groupSel') { state.filters.group = e.target.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'codeInput') doLogin();
  if (e.key === 'Escape') closeModal();
});

/* ---------- demo mode (fake data, no server) ---------- */
let demo = null;
function demoInit() {
  const T = [1,2,3,4,5,6,7,8,9].map(i => ({ id:'t' + i, name:'Teacher ' + i, email:'teacher' + i + '@example.org', role:'teacher', scope:'', active:true }));
  const users = T.concat([
    { id:'u_w', name:'Wendy Blasingame', email:'', role:'interventionist', scope:'tiered', active:true },
    { id:'u_a', name:'Abby Danielson', email:'', role:'interventionist', scope:'dyslexia', active:true },
    { id:'u_p', name:'Courtney Pine', email:'', role:'principal', scope:'', active:true }]);
  const groups = [
    { id:'g1', name:'Reading', type:'push-in', staffName:'Wendy Blasingame', timeBlock:'' }, { id:'g2', name:'Math', type:'push-in', staffName:'Wendy Blasingame', timeBlock:'' },
    { id:'g3', name:'Reading', type:'pull-out', staffName:'Wendy Blasingame', timeBlock:'' }, { id:'g4', name:'Math', type:'pull-out', staffName:'Wendy Blasingame', timeBlock:'' },
    { id:'g5', name:'Group 1', type:'dyslexia', staffName:'Abby Danielson', timeBlock:'' }, { id:'g6', name:'Group 2', type:'dyslexia', staffName:'Abby Danielson', timeBlock:'' }];
  const acc = n => ['Extended time|Tests and quizzes|FIE','Read aloud|Directions and items|FIE','Small group|Tests and quizzes|Team','Frequent breaks|All classes|Team'].slice(0, n).map((x, i) => { const p = x.split('|'); return { id:'a' + i, name:p[0], appliesTo:p[1], source:p[2] }; });
  const mk = (id, name, grade, teacherIds, tier, dys, sp, groupIds, nacc) => ({ id, name:'Sample Student ' + name, grade, teacherIds, tier, dyslexia:dys, speech:sp, groupIds, parents:[{ name:'Parent Sample', relation:'Parent', phone:'555-0100', email:'parent@example.org' }], keyDates:{ fie:'2025-10-14' }, accommodations:acc(nacc), accommodationLog:[], archived:false });
  const students = [mk('s1','A','K3',['t1'],'tier1',false,false,['g1'],2), mk('s2','B','1st',['t2'],'tier2',true,false,['g3','g6'],4), mk('s3','C','2nd',['t3'],'tier1',false,true,['g2'],2), mk('s4','D','3rd',['t4'],'monitor',false,false,[],1),
    mk('s5','E','4th',['t5','t6'],'tier2',false,false,['g4'],3), mk('s6','F','5th',['t7','t8'],'none',true,false,['g5'],3), mk('s7','G','K3',['t9'],'monitor',false,false,[],1), mk('s8','H','3rd',['t4'],'tier1',true,false,['g1','g6'],3)];
  const codes = { 'demo-admin':{ id:'admin', name:'Admin', role:'admin', scope:'all' }, 'demo-wendy':{ id:'u_w', name:'Wendy Blasingame', role:'interventionist', scope:'tiered' }, 'demo-abby':{ id:'u_a', name:'Abby Danielson', role:'interventionist', scope:'dyslexia' }, 'demo-principal':{ id:'u_p', name:'Courtney Pine', role:'principal', scope:'all' }, 'demo-teacher':{ id:'t4', name:'Teacher 4', role:'teacher', scope:'' } };
  demo = { users, groups, students, codes, logins:[], sessions:{} };
}
function demoApi(action, b) {
  if (!demo) demoInit();
  const ok = x => Promise.resolve(JSON.parse(JSON.stringify(Object.assign({ ok:true }, x || {}))));
  const err = e => Promise.resolve({ error: e });
  if (action === 'login') {
    const u = demo.codes[b.code];
    demo.logins.unshift({ time:new Date().toISOString(), ok:!!u, name:u ? u.name : '', role:u ? u.role : '' });
    if (!u) return err('Invalid code');
    const t = 'demo' + Math.random().toString(36).slice(2).padEnd(40, 'x'); demo.sessions[t] = u; return ok({ token:t, user:u });
  }
  const me = demo.sessions[b.token]; if (!me) return err('auth');
  const dys = new Set(demo.groups.filter(g => g.type === 'dyslexia').map(g => g.id));
  const visible = demo.students.filter(s => !s.archived && (me.role === 'admin' || me.role === 'principal' || (me.role === 'interventionist' && (me.scope === 'dyslexia' ? (s.dyslexia || s.groupIds.some(i => dys.has(i))) : s.tier !== 'none')) || (me.role === 'teacher' && s.teacherIds.includes(me.id))));
  if (action === 'logout') return ok();
  if (action === 'getAll') {
    const shaped = visible.map(s => me.role === 'teacher' ? { id:s.id, name:s.name, grade:s.grade, teacherIds:s.teacherIds, tier:s.tier, dyslexia:s.dyslexia, speech:s.speech, accommodations:s.accommodations, accommodationLog:s.accommodationLog } : s);
    const tids = new Set(); visible.forEach(s => s.teacherIds.forEach(t => tids.add(t)));
    const out = { user:me, students:shaped, groups: me.role === 'teacher' ? [] : demo.groups.filter(g => !g.archived), teachers: demo.users.filter(u => u.role === 'teacher' && u.active && (me.role !== 'teacher' || tids.has(u.id))).map(u => ({ id:u.id, name:u.name, email:u.email })) };
    if (me.role === 'admin') out.users = demo.users;
    if (me.role !== 'teacher') out.staff = demo.users.filter(u => u.role === 'interventionist' && u.active).map(u => ({ name:u.name, scope:u.scope }));
    return ok(out);
  }
  if (action === 'logAccommodationUse') {
    if (me.role !== 'teacher') return err('Not allowed');
    const s = visible.find(x => x.id === b.studentId); const a = s && s.accommodations.find(x => x.id === b.accommodationId);
    if (!a) return err('Choose an accommodation');
    s.accommodationLog.push({ id:'l' + Date.now(), date:b.date || today(), teacherId:me.id, teacherName:me.name, accommodationId:a.id, accommodationName:a.name, result:b.result, note:b.note || '', loggedAt:new Date().toISOString() });
    return ok();
  }
  if (me.role !== 'admin') return err('Not allowed');
  if (action === 'saveStudent') {
    const i = demo.students.findIndex(s => s.id === b.student.id); const s = Object.assign({ id:'s' + Date.now(), accommodationLog:[], accommodations:[], archived:false }, i >= 0 ? demo.students[i] : {}, b.student);
    if (!s.name) return err('Student name is required'); if (i >= 0) demo.students[i] = s; else demo.students.push(s); return ok({ student:s });
  }
  if (action === 'archiveStudent') { const s = demo.students.find(x => x.id === b.id); if (s) s.archived = true; return ok(); }
  if (action === 'saveGroup') { const i = demo.groups.findIndex(g => g.id === b.group.id); if (i >= 0) Object.assign(demo.groups[i], b.group); else demo.groups.push(Object.assign({ id:'g' + Date.now() }, b.group)); return ok(); }
  if (action === 'archiveGroup') { demo.groups = demo.groups.filter(g => g.id !== b.id); demo.students.forEach(s => { s.groupIds = s.groupIds.filter(x => x !== b.id); }); return ok(); }
  if (action === 'saveUser') {
    const u = b.user; if (!u.name) return err('Name is required');
    const code = u.code || (lastName(u.name) + '2627'); const i = demo.users.findIndex(x => x.id === u.id);
    const rec = Object.assign({ id:'u' + Date.now(), active:true }, i >= 0 ? demo.users[i] : {}, { name:u.name, email:u.email, role:u.role, scope:u.role === 'interventionist' ? u.scope : '' });
    if (i >= 0) demo.users[i] = rec; else demo.users.push(rec);
    return ok({ user:rec, code: (!u.id || u.code) ? code : null });
  }
  if (action === 'removeUser') { const u = demo.users.find(x => x.id === b.id); if (u) u.active = false; return ok(); }
  if (action === 'getLoginLog') return ok({ logins: demo.logins });
  return err('Unknown action');
}

/* ---------- start ---------- */
(async function init() {
  try {
    const saved = JSON.parse(sessionStorage.getItem('elem_session') || 'null');
    if (saved && saved.token && !DEMO) { state.token = saved.token; state.user = saved.user; await loadAll(); return; }
  } catch (e) {}
  render();
})();
</script>
