.dayb{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:#3E4C59;min-height:36px;padding-right:6px}.dayb input{width:18px;height:18px}
.blkrow{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:10px;border:1px solid #E3E8EE;border-radius:10px;background:#FAFAF8}
.blkrow .fl{flex:1 1 90px;min-width:0}.blkrow .nm{flex:3 1 200px}
.bar{height:10px;border-radius:999px;background:#E3E8EE;overflow:hidden}.bar i{display:block;height:100%;background:#2563A8}

.svc{background:#E3F4DA;color:#2F5D1A}.cf{background:#FFF4DB;color:#6B4A00}.nosc{background:#ECEFF2;color:#3E4C59}
.chip.err{background:#FBE3E4;color:#7A1A1F}

.cal>div{background:#fff;min-height:96px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .off{background:#FAFAF8;color:#8A97A5}.cal .tod{box-shadow:inset 0 0 0 2px #2563A8}
.cd{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#3E4C59}
.tev,.evc{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:0;border-left:4px solid;border-radius:6px;padding:4px 6px;font-size:12px;font-weight:600;color:#1B2733;min-height:28px}

.ev-ok{border-color:#2E7D5B;background:#E8F5EE}.ev-pend{border-color:#C98A00;background:#FFF4DB}.ev-no{border-color:#A4262C;background:#FBE3E4}
.tev.ev-no b,.tev.ev-no{text-decoration:line-through}
.wtag{background:#E9E3F6;color:#3F2A78;margin:0;padding:1px 7px;font-size:11px}

@media(max-width:700px){.side{max-width:none;border-right:0;border-bottom:1px solid #E3E8EE}.main{padding:16px}}

<body>
<div id="app"></div>
<div id="modalRoot"></div>
<script>
'use strict';
/* ===== CONFIG: paste your deployed Apps Script web app URL (ends in /exec) between the quotes ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbzHBgT9-hNpBDGCrAr8tnWNBzDLb542t2bigo8PlGRM1e757bdYc6SJAyTEqeOoIHjq/exec';
/* ================================================================================================ */
const DEMO = API_URL.indexOf('PASTE_') === 0;   // with no URL set, the page runs on fake sample data
const IDLE_MS = 30 * 60 * 1000;

const GRADES = ['K3','K4','K5','1st','2nd','3rd','4th','5th'];
const TIER_LABEL = { tier1:'Tier 1', tier2:'Tier 2', monitor:'Monitor', none:'No tier' };
const TIER_CLASS = { tier1:'t1', tier2:'t2', monitor:'mon', none:'none' };
const TYPE_LABEL = { 'push-in':'Push-in', 'pull-out':'Pull-out', 'dyslexia':'Dyslexia' };
const ROLE_LABEL = { admin:'Admin', interventionist:'Interventionist', principal:'Principal', teacher:'Teacher' };
const ROLE_CLASS = { admin:'r-admin', interventionist:'r-int', principal:'r-prin', teacher:'r-teach' };
const DAY_KEYS = ['M','T','W','R','F'];
const DAY_LABEL = { M:'Mon', T:'Tue', W:'Wed', R:'Thu', F:'Fri' };
const ATTEND = ['Present','Absent','Excused','Left early'];
const SCOPE_LABEL = { tiered:'Students with a tier', dyslexia:'Dyslexia students', all:'All students' };
const TABS = ['Overview','Teacher Information','Accommodations','Progress Monitoring','Testing History','Documentation','Grade History'];
const COMING = {};
const VIEW_COMING = {};
const PROGRESS_MEASURES = ['NWEA Reading','NWEA Math','DRA','BUILD','Take Flight','Other'];
const NOTE_TYPES = ['Reminder','Observation','Parent phone call','Email','Fall conference','Spring conference','Intervention team meeting','Other'];
const GRADE_LABELS = ['Meets','Approaching','Needs Improvement'];
const LABEL_RANK = { 'Meets':3, 'Approaching':2, 'Needs Improvement':1 };
const MEASURE_COLOR = { 'NWEA Reading':'#2563A8', 'NWEA Math':'#B5651D', 'DRA':'#2E7D5B', 'BUILD':'#7A3F8F', 'Take Flight':'#A4262C', 'Other':'#5A6B7B' };
const MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WATCH_DROP = 3;   // grade watch list: average fell this many points or more since the previous report
const PALETTE = [['#E3EEF8','#1F4E87'],['#DFF2EC','#0E5C52'],['#FCEBD7','#7A4A0A'],['#ECE7F7','#3F2A78']];

const state = {
  token: null, user: null, data: null, view: 'home', selectedId: null, tab: 'Overview',
  filters: { q:'', tier:'', dyslexia:false, speech:false, group:'', grade:'' },
  syncedAt: null, notice: null, loginMsg: '', logins: null,
  gu: null, guMonth: '', rep: 'service', rp: {}, noteType: '', pmGroup: '',
  day: ({1:'M',2:'T',3:'W',4:'R',5:'F'})[new Date().getDay()] || 'M'
};

/* ---------- helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const role = () => state.user ? state.user.role : '';
const isAdmin = () => role() === 'admin';
const isTeacher = () => role() === 'teacher';
const lastName = n => String(n).trim().split(/\s+/).pop().toLowerCase();
const initials = n => { const p = String(n).trim().split(/\s+/); return ((p[0]||'')[0] || '') + ((p.length > 1 ? p[p.length-1] : '')[0] || ''); };
const palette = n => PALETTE[[...String(n)].reduce((a, c) => a + c.charCodeAt(0), 0) % PALETTE.length];
const fmtDate = d => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ''); return m ? `${+m[2]}/${+m[3]}/${m[1]}` : ''; };
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const timeStr = d => d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
const groupLabel = g => `${TYPE_LABEL[g.type] || g.type} · ${g.name}`;
const sortStudents = list => list.slice().sort((a, b) => lastName(a.name).localeCompare(lastName(b.name)) || a.name.localeCompare(b.name));
const groupById = id => (state.data.groups || []).find(g => g.id === id);
const teacherById = id => (state.data.teachers || []).find(t => t.id === id);
const student = () => state.data && state.data.students.find(s => s.id === state.selectedId);
const schedById = id => (state.data.schedules || []).find(x => x.id === id);
const hm = t => { const m = /^(\d\d):(\d\d)$/.exec(t || ''); return m ? ((+m[1] % 12) || 12) + ':' + m[2] : ''; };
const rangeStr = (a, b) => (a && b) ? hm(a) + '–' + hm(b) : '';
const daysStr = d => (d || []).length === 5 ? 'Daily' : (d || []).map(x => DAY_LABEL[x]).join(', ');
const minsBetween = (a, b) => (+b.slice(0,2) * 60 + +b.slice(3)) - (+a.slice(0,2) * 60 + +a.slice(3));
const overlaps = (a1, a2, b1, b2) => a1 < b2 && b1 < a2;
const groupWhen = g => (g.days && g.days.length && g.start && g.end) ? daysStr(g.days) + ' · ' + rangeStr(g.start, g.end) : (g.timeBlock || '');
const weekMins = g => (g.days && g.start && g.end && g.end > g.start) ? g.days.length * minsBetween(g.start, g.end) : 0;
const canEditSession = x => isAdmin() || (role() === 'interventionist' && x.loggedById === state.user.id);
const canLog = () => (state.data.groups || []).some(g => g.mine);
const typeChip = g => `<span class="chip ${g.type === 'dyslexia' ? 'dys' : 'grp'}">${esc(TYPE_LABEL[g.type])}</span>`;
function groupMembers(g) {
  if (g.members) return sortStudents(g.members);
  return sortStudents(state.data.students.filter(s => (s.groupIds || []).includes(g.id)).map(s => ({ id: s.id, name: s.name, grade: s.grade })));
}
/* Where a group's time lands on a student's day: fixed blocks (specials, PE, lunch, recess, chapel) and the student's other groups. */
function groupConflicts(s, g) {
  if (!g.start || !g.end || !(g.days || []).length) return [];
  const sc = schedById(s.scheduleId); const hits = {};
  const add = (label, d) => { (hits[label] = hits[label] || []).push(DAY_LABEL[d]); };
  (g.days || []).forEach(d => {
    if (sc) sc.blocks.forEach(b => { if (b.kind === 'fixed' && b.days.includes(d) && overlaps(g.start, g.end, b.start, b.end)) add(b.name, d); });
    (s.groupIds || []).filter(id => id !== g.id).map(groupById).filter(o => o && o.start && o.end && (o.days || []).includes(d)).forEach(o => { if (overlaps(g.start, g.end, o.start, o.end)) add(groupLabel(o), d); });
  });
  return Object.keys(hits).map(k => k + ' (' + hits[k].join(', ') + ')');
}

function tierSummary(s) {
  const parts = [s.grade];
  if (s.tier === 'none' && s.dyslexia && !s.speech) parts.push('Dyslexia only');
  else {
    parts.push(TIER_LABEL[s.tier]);
    if (s.dyslexia) parts.push('Dyslexia');
    if (s.speech) parts.push('Speech');
  }
  return parts.join(' · ');
}
function flagChips(s) {
  let h = '';
  if (s.tier !== 'none') h += `<span class="chip ${TIER_CLASS[s.tier]}">${TIER_LABEL[s.tier]}</span>`;
  if (s.dyslexia) h += '<span class="chip dys">Dyslexia</span>';
  if (s.speech) h += '<span class="chip sp">Speech</span>';
  if (s.tier === 'none' && !s.dyslexia && !s.speech) h += '<span class="chip none">No tier</span>';
  return h;
}
function seenBy(s) {
  // Same rule the server uses to decide which interventionist sees a student.
  const dysGroup = (s.groupIds || []).some(id => { const g = groupById(id); return g && g.type === 'dyslexia'; });
  return (state.data.staff || []).filter(p => p.scope === 'all' || (p.scope === 'dyslexia' ? (s.dyslexia || dysGroup) : s.tier !== 'none'))
    .map(p => lastName(p.name).replace(/^./, c => c.toUpperCase())).join(', ');
}

/* ---------- API ---------- */
async function api(action, payload) {
  const body = Object.assign({ action, token: state.token }, payload || {});
  if (DEMO) return demoApi(action, body);
  try {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
    return await res.json();
  } catch (e) {
    return { error: 'Could not reach the server. Check your connection and try again.' };
  }
}
function handleAuthError(r) {
  if (r && r.error === 'auth') { signOutLocal('Your session expired. Please sign in again.'); return true; }
  return false;
}

/* ---------- session ---------- */
function saveSession() { try { sessionStorage.setItem('elem_session', JSON.stringify({ token: state.token, user: state.user })); } catch (e) {} }
function signOutLocal(msg) {
  state.token = null; state.user = null; state.data = null; state.selectedId = null; state.view = 'home';
  state.loginMsg = msg || '';
  try { sessionStorage.removeItem('elem_session'); } catch (e) {}
  closeModal(); render();
}
async function signOut() { const t = state.token; if (t) await api('logout'); signOutLocal(''); }
let idleTimer = null;
function bumpIdle() { clearTimeout(idleTimer); if (state.token) idleTimer = setTimeout(() => signOutLocal('You were signed out after 30 minutes of inactivity.'), IDLE_MS); }
['click','keydown'].forEach(ev => document.addEventListener(ev, bumpIdle, true));

async function doLogin() {
  const input = $('codeInput'); const code = input.value.trim();
  if (!code) { state.loginMsg = 'Enter your access code.'; render(); return; }
  $('loginBtn').disabled = true; $('loginBtn').textContent = 'Signing in...';
  const r = await api('login', { code });
  if (r.error) { state.loginMsg = r.message || (r.error === 'Invalid code' ? 'That code did not work.' : r.error); render(); return; }
  state.token = r.token; state.user = r.user; state.loginMsg = ''; state.view = 'home'; state.selectedId = null;
  saveSession();
  await loadAll(true);
}
async function loadAll(showErr) {
  const r = await api('getAll');
  if (handleAuthError(r)) return;
  if (r.error) { state.notice = { type:'err', text: r.error }; render(); return; }
  state.data = r; state.user = r.user; state.syncedAt = new Date();
  if (state.selectedId && !state.data.students.some(s => s.id === state.selectedId)) state.selectedId = null;
  bumpIdle(); render();
}

/* ---------- rendering ---------- */

function loginHtml() {

function bodyHtml() {
  const v = state.view;
  const notice = state.notice ? `<div class="banner ${state.notice.type}" role="status">${esc(state.notice.text)}</div>` : '';
  if (v === 'home') return `<div class="body">${sideHtml()}<section class="main">${notice}${student() ? profileHtml(student()) : emptyHtml()}</section></div>`;
  let inner;
  if ((v === 'reports' && isTeacher()) || (v === 'grades' && !isAdmin())) inner = emptyHtml();
  else if (v === 'reports') inner = reportsHtml();
  else if (v === 'grades') inner = gradesHtml();
  else if (v === 'overview') inner = overviewHtml();
  else if (v === 'testing-calendar') inner = calendarHtml();
  else if (v === 'testing-summary') inner = summaryHtml();
  else if (v === 'access') inner = accessHtml();
  else if (v === 'logins') inner = loginsHtml();
  else { const c = VIEW_COMING[v]; inner = `<div class="card muted"><h2>${esc(c[0])}</h2><p class="empty">${esc(c[1])}</p></div>`; }

function teacherTab(s) {

function studentConflicts(s) {
  const out = [];
  (s.groupIds || []).map(groupById).filter(Boolean).forEach(g => groupConflicts(s, g).forEach(c => out.push(groupLabel(g) + ' overlaps ' + c)));

function scheduleCard(s) {
  const sc = schedById(s.scheduleId);

  if (!sc) return `<section class="card" style="flex:2 1 520px">${head('Daily schedule')}<p class="empty">No class schedule assigned yet.${isAdmin() ? ' Choose one with Edit student.' : ''}</p></section>`;
  const day = state.day;

  const items = sc.blocks.filter(b => b.days.includes(day)).map(b => ({ start: b.start, end: b.end, name: b.name, kind: b.kind }))
    .concat(svc.map(g => ({ start: g.start, end: g.end, name: groupLabel(g), g })));
  items.sort((a, b) => a.start.localeCompare(b.start) || a.end.localeCompare(b.end));

/* services this month (admin, interventionists, principal) */
function serviceRows(s) {
  return (state.data.sessions || []).map(x => ({ x, a: (x.attendance || []).find(a => a.studentId === s.id) })).filter(r => r.a)
    .sort((p, q) => (q.x.date + q.x.loggedAt).localeCompare(p.x.date + p.x.loggedAt));
}
function servicesCard(s) {
  const groups = (s.groupIds || []).map(groupById).filter(Boolean);
  const ym = today().slice(0, 7); const rows = serviceRows(s);
  const month = rows.filter(r => r.x.date.startsWith(ym));
  const held = month.reduce((n, r) => n + r.x.minutes, 0);
  const got = month.filter(r => r.a.status === 'Present' || r.a.status === 'Left early').reduce((n, r) => n + r.x.minutes, 0);
  const pct = held ? Math.round(got * 100 / held) : 0;

  const hist = rows.slice(0, 15).map(r => `<tr><td>${esc(fmtDate(r.x.date))}</td><td>${esc(groupLabel({ type: r.x.groupType, name: r.x.groupName }))}</td><td>${r.x.minutes}</td><td>${esc(r.a.status)}</td><td>${esc(r.a.note)}</td></tr>`).join('');

    ${held ? `<div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>` : ''}

}

const shortDate = d => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ''); return m ? `${+m[2]}/${+m[3]}/${m[1].slice(2)}` : ''; };

/** One line chart for one scale (NWEA reading and math share a scale; DRA, BUILD and Take Flight each have their own). */
function trendSvg(entries, measures) {
  const pts = entries.filter(x => x.value != null && measures.includes(x.measure)).sort((a, b) => a.date.localeCompare(b.date));
  if (!pts.length) return '';
  const W = 640, H = 230, L = 46, R = 18, T = 16, B = 38;
  let lo = Math.min(...pts.map(p => p.value)), hi = Math.max(...pts.map(p => p.value));
  if (hi - lo < 4) { lo -= 2; hi += 2; } else { const pad = (hi - lo) * 0.12; lo -= pad; hi += pad; }
  const t0 = Math.min(...pts.map(p => dayMs(p.date))), t1 = Math.max(...pts.map(p => dayMs(p.date)));
  const X = d => L + (t1 === t0 ? (W - L - R) / 2 : (dayMs(d) - t0) / (t1 - t0) * (W - L - R));
  const Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const grid = [0, 1, 2, 3].map(i => { const v = lo + (hi - lo) * i / 3; return `<line x1="${L}" y1="${Y(v).toFixed(1)}" x2="${W - R}" y2="${Y(v).toFixed(1)}" stroke="#E3E8EE"/><text x="${L - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="#5A6B7B">${Math.round(v)}</text>`; }).join('');
  const series = measures.map(m => ({ m, p: pts.filter(x => x.measure === m) })).filter(s => s.p.length);
  const lines = series.map(s => `<polyline fill="none" stroke="${MEASURE_COLOR[s.m]}" stroke-width="3" stroke-linejoin="round" points="${s.p.map(p => X(p.date).toFixed(1) + ',' + Y(p.value).toFixed(1)).join(' ')}"/>` +
    s.p.map(p => `<circle cx="${X(p.date).toFixed(1)}" cy="${Y(p.value).toFixed(1)}" r="5" fill="${MEASURE_COLOR[s.m]}"><title>${esc(p.measure + ' ' + p.score + ' on ' + fmtDate(p.date))}</title></circle>`).join('')).join('');
  const dates = [...new Set(pts.map(p => p.date))]; const step = Math.max(1, Math.ceil(dates.length / 6));
  const xl = dates.filter((d, i) => i % step === 0 || i === dates.length - 1).map(d => `<text x="${X(d).toFixed(1)}" y="${H - 14}" text-anchor="middle" font-size="11" fill="#5A6B7B">${esc(shortDate(d))}</text>`).join('');
  const desc = series.map(s => s.m + ': ' + s.p.map(p => p.score + ' on ' + fmtDate(p.date)).join(', ')).join('; ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="${esc('Trend. ' + desc)}">${grid}${lines}${xl}</svg>` +
    `<div style="display:flex;flex-wrap:wrap;gap:16px;font-size:13px;margin-top:6px">${series.map(s => `<span><b style="color:${MEASURE_COLOR[s.m]}">&#9632;</b> ${esc(s.m)}</span>`).join('')}</div>`;
}

function latestByMeasure(list) {
  const out = {};
  list.slice().sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || '').localeCompare(a.createdAt || '')).forEach(x => { if (!out[x.measure]) out[x.measure] = x; else if (!out[x.measure].prev) out[x.measure].prev = x; });
  return out;
}
/** Compare the newest grade report with the one before it. */
function gradeTrend(g) {
  if (g.length < 2) return null;
  const cur = g[0], prev = g[1];
  if (cur.kind === 'number') {
    const delta = (cur.average != null && prev.average != null) ? Math.round((cur.average - prev.average) * 10) / 10 : null;
    let worst = null;
    Object.keys(cur.values).forEach(k => { if (prev.values[k] != null) { const d = Math.round((cur.values[k] - prev.values[k]) * 10) / 10; if (!worst || d < worst.d) worst = { subject: k, d }; } });
    return { kind: 'number', delta, worst, watch: delta != null && delta <= -WATCH_DROP, prev };
  }
  const down = Object.keys(cur.values).filter(k => prev.values[k] && LABEL_RANK[cur.values[k]] < LABEL_RANK[prev.values[k]]);
  const ni = Object.keys(cur.values).filter(k => cur.values[k] === 'Needs Improvement');
  return { kind: 'label', down, ni, watch: down.length > 0 || ni.length > 0, prev };
}
const labelChip = v => `<span class="chip ${v === 'Meets' ? 'svc' : v === 'Approaching' ? 'cf' : 'err'}">${esc(v)}</span>`;

function gradeTab(s) {
  const g = stuGrades(s);
  if (!g.length) {

    return `<section class="card muted"><h2>Grade history</h2><p class="empty">${esc(msg)}</p></section>`;
  }
  const subjects = []; g.forEach(r => Object.keys(r.values).forEach(k => { if (!subjects.includes(k)) subjects.push(k); }));
  const label = g[0].kind === 'label';
  const head = `<tr><th>Report</th>${label ? '' : '<th>Average</th>'}${subjects.map(k => `<th>${esc(k)}</th>`).join('')}</tr>`;
  const body = g.map(r => `<tr><td><b>${esc(monthLabel(r.month))}</b></td>${label ? '' : `<td style="font-size:18px;font-weight:700;color:#2E4057">${r.average != null ? r.average : ''}</td>`}${subjects.map(k => `<td>${r.values[k] == null ? '' : (r.kind === 'label' ? labelChip(r.values[k]) : esc(r.values[k]))}</td>`).join('')}</tr>`).join('');
  const t = gradeTrend(g);
  let flag = '';
  if (t && t.watch) {
    flag = t.kind === 'number' ? `Average down ${Math.abs(t.delta)} points since ${monthLabel(t.prev.month)}.${t.worst && t.worst.d < 0 ? ` ${t.worst.subject} down ${Math.abs(t.worst.d)}.` : ''}`
      : (t.down.length ? `Moved down since ${monthLabel(t.prev.month)}: ${t.down.join(', ')}. ` : '') + (t.ni.length ? `Needs Improvement: ${t.ni.join(', ')}.` : '');

function parseDelimited(text) {

  const first = text.split(/\r?\n/)[0] || '';

function reportData(key) {
  const R = recs(); const list = sortStudents(state.data.students); const rp = state.rp || {};
  if (key === 'service') {
    const per = {}; list.forEach(s => { per[s.id] = { n: 0, pres: 0, abs: 0, mins: 0 }; });
    (state.data.sessions || []).forEach(x => (x.attendance || []).forEach(a => { const p = per[a.studentId]; if (!p) return; p.n++; if (a.status === 'Present' || a.status === 'Left early') { p.pres++; p.mins += x.minutes; } else p.abs++; }));

      rows: list.filter(s => per[s.id].n).map(s => { const p = per[s.id]; return [s.name, s.grade, p.n, p.pres, p.abs, p.mins, Math.round(p.pres / p.n * 100) + '%']; }) };
  }

        return [s.name, s.grade, ...cols.map(m => { const x = lat[m]; if (!x) return ''; let ch = ''; if (x.prev && x.value != null && x.prev.value != null) { const d = Math.round((x.value - x.prev.value) * 10) / 10; ch = ' (' + (d > 0 ? '+' : '') + d + ')'; } return x.score + ch + ' · ' + shortDate(x.date); })]; }).filter(r => r.slice(2).some(Boolean)) };
  }

      if (!t || !t.watch) return;

      rows: R.notes.filter(x => x.date >= from && x.date <= to && (!type || x.type === type)).sort((a, b) => b.date.localeCompare(a.date)).map(x => { const s = state.data.students.find(y => y.id === x.studentId) || {}; return [fmtDate(x.date), x.studentName || s.name || '', s.grade || '', x.type, x.who || '', x.byName || '', x.text]; }), filters: true, from, to, type };
  }

  const cut = new Date(); cut.setDate(cut.getDate() - 90); const cutS = `${cut.getFullYear()}-${String(cut.getMonth() + 1).padStart(2, '0')}-${String(cut.getDate()).padStart(2, '0')}`;

function clockText(t) {
  const m = /^(\d{1,2}):(\d{2})\s*([ap]m?)?$/i.exec(String(t).trim()); if (!m) return '';

  if (ap.startsWith('p') && h < 12) h += 12; else if (ap.startsWith('a') && h === 12) h = 0; else if (!ap && h >= 1 && h <= 6) h += 12;
  return h > 23 ? '' : String(h).padStart(2, '0') + ':' + m[2];
}
function parsePasted(text) {

  String(text).split('\n').map(l => l.trim()).filter(Boolean).forEach(line => {
    const p = line.split('|').map(x => x.trim());
    let days, time, name, kind;
    if (p.length >= 3) { days = p[0]; time = p[1]; name = p[2]; kind = p[3]; } else if (p.length === 2) { days = ''; time = p[0]; name = p[1]; } else { bad.push(line); return; }
    const d = (days || 'MTWRF').toUpperCase().replace(/TH/g, 'R').replace(/[^MTWRF]/g, '');
    const t = time.split(/\s*[-–]\s*/); const a = clockText(t[0] || ''), b = clockText(t[1] || '');
    if (!d || !a || !b || b <= a || !name) { bad.push(line); return; }
    out.push({ days: [...new Set(d.split(''))], start: a, end: b, name, kind: String(kind || '').toLowerCase().startsWith('f') ? 'fixed' : 'class' });
  });
  return { out, bad };
}

const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTH_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const tests = () => recs().tests || [];
const windows = () => recs().windows || [];
const isApprover = () => isAdmin() || !!(state.user && state.user.canApprove);

const isoOf = ms => { const d = new Date(ms); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0'); };

const dayKeyOf = d => ({ 1:'M', 2:'T', 3:'W', 4:'R', 5:'F' })[dowOf(d)] || '';

/* conflicts: a student's specials, lunch and pull-out services, and other tests at the same time; staff who are busy */
function conflictsFor(date, start, end, stu, excludeId) {
  const out = []; const dk = dayKeyOf(date);

  const sc = schedById(stu.scheduleId);
  if (sc) sc.blocks.forEach(b => { if (b.kind === 'fixed' && (b.days || []).includes(dk) && overlaps(start, end, b.start, b.end)) out.push(b.name + ' ' + rangeStr(b.start, b.end)); });
  const full = studentById(stu.id);
  ((full && full.groupIds) || []).map(groupById).filter(g => g && g.start && g.end && g.type !== 'push-in' && (g.days || []).includes(dk) && overlaps(start, end, g.start, g.end)).forEach(g => out.push(groupLabel(g) + ' ' + rangeStr(g.start, g.end)));
  tests().filter(x => x.id !== excludeId && x.date === date && x.status !== 'declined' && (x.studentIds || []).includes(stu.id) && overlaps(start, end, x.start, x.end)).forEach(x => out.push('Another test: ' + x.title + ' ' + rangeStr(x.start, x.end)));

function staffBusy(where, date, start, end, excludeId) {

function winTags(d) { return calWindows().filter(w => w.start <= d && d <= w.end).map(w => `<span class="chip wtag">${esc(w.measure)}</span>`).join(''); }
function monthGrid(c) {
  const first = c.date.slice(0, 7) + '-01'; const list = calTests();
  let d = weekStartOf(first); const cells = []; const ym = c.date.slice(0, 7);
  const lastMs = Date.UTC(+c.date.slice(0, 4), +c.date.slice(5, 7), 0);
  while (dayMs(d) <= lastMs) {

  if (r === 'month') { const y = +t.slice(0, 4), m = +t.slice(5, 7); return [t.slice(0, 7) + '-01', isoOf(Date.UTC(y, m, 0)), MONTH_LONG[m - 1]]; }
  return [ws, addDays(ws, 4), 'This week'];
}

  const days = []; for (let x = d.a; x <= d.b; x = addDays(x, 1)) if (dayKeyOf(x)) days.push(x);
  const loadRows = days.map(x => { const e = d.ok.filter(t => t.date === x); const c = k => e.filter(t => t.where === k).length; return `<tr><td>${esc(dayLabel(x))}</td><td>${c('hub')}</td><td>${c('wendy')}</td><td>${c('abby')}</td><td>${c('tbd')}</td></tr>`; }).join('');
  const rows = d.rows.map(r => `<tr><td style="white-space:nowrap">${esc(shortDate(r.t.date))}<div class="small">${esc(tRange(r.t))}</div></td><td><b>${esc(r.s.name)}</b><div class="small">${esc(r.s.grade)}</div></td><td>${esc(r.t.title)}</td><td>${esc(WHERE_SHORT[r.t.where])}</td><td>${accChips(r.s) || '<span class="small">None</span>'}</td><td>${r.c.map(x => `<div class="small" style="color:#7A1A1F">${esc(x)}</div>`).join('') || '<span class="small">-</span>'}</td></tr>`).join('');
  const rb = (k, l) => `<button class="fc ${state.ts.range === k ? 'on' : ''}" data-act="tsRange" data-r="${k}">${l}</button>`;
  return `<div class="tiles">${tile(d.ok.length, 'Approved tests')}${tile(ids.size, 'Students testing')}${tile(withAcc.size, 'With accommodations')}${tile(cnt('wendy'), 'With Mrs. Blasingame')}${tile(cnt('abby'), 'With Mrs. Danielson')}${tile(d.pending.length, 'Waiting for approval')}</div>
    <section class="card"><h2>Testing summary: ${esc(label)}</h2><div style="margin-bottom:10px">${rb('week', 'This week')}${rb('next', 'Next week')}${rb('month', 'This month')}</div>
      ${d.pending.length ? `<div class="banner warn" style="margin-bottom:10px">${d.pending.length} test${d.pending.length === 1 ? ' is' : 's are'} not approved yet and not counted below.</div>` : ''}
      <div class="fh">TESTS BY DAY AND PLACE</div><div class="tw"><table style="min-width:420px"><thead><tr><th>Day</th><th>Hub (in class)</th><th>Blasingame</th><th>Danielson</th><th>Not set</th></tr></thead><tbody>${loadRows}</tbody></table></div></section>
    <section class="card"><h2>What each student needs</h2>${rows ? `<div class="tw"><table style="min-width:720px"><thead><tr><th>When</th><th>Student</th><th>Test</th><th>Where</th><th>Accommodations</th><th>Schedule overlaps</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="empty">No approved tests in this range.</p>'}
      <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap"><button class="secondary" data-act="downloadPrep" ${rows ? '' : 'disabled'}>Download CSV</button><button class="secondary" data-act="printPage">Print</button></div>
      <div class="small" style="margin-top:8px">${isTeacher() ? 'Shows your own students.' : role() === 'principal' ? 'View only.' : 'Shows tests you can see.'}</div></section>`;
}

/* ----- student's Testing History tab ----- */
function testingTab(s) {
  const t0 = today(); const prog = stuProgress(s);
  const wins = windows().filter(w => winApplies(w, s.grade)).sort((a, b) => b.start.localeCompare(a.start));
  const wRows = wins.map(w => {
    const hits = prog.filter(x => x.date >= w.start && x.date <= w.end && (w.measure === 'NWEA' ? /^NWEA/.test(x.measure) : x.measure === 'DRA'));
    const st = hits.length ? 'Done' : t0 < w.start ? 'Upcoming' : t0 <= w.end ? 'Open' : 'Missed';
    const cls = { Done:'svc', Upcoming:'none', Open:'cf', Missed:'err' }[st];
    return `<tr><td><b>${esc(w.name)}</b><div class="small">${esc(w.measure)}</div></td><td>${esc(winRange(w))}</td><td><span class="chip ${cls}">${st}</span></td><td>${hits.map(h => `<div>${esc(h.measure)}: <b>${esc(h.score)}</b> <span class="small">${esc(shortDate(h.date))}</span></div>`).join('') || '<span class="small">-</span>'}</td></tr>`; }).join('');
  const mine = tests().filter(t => (t.studentIds || []).includes(s.id)).sort((a, b) => b.date.localeCompare(a.date));
  const tRows = mine.map(t => `<tr><td style="white-space:nowrap">${esc(fmtDate(t.date))}</td><td><b>${esc(t.title)}</b><div class="small">${esc(t.type)}</div></td><td>${esc(WHERE_SHORT[t.where])}</td><td>${statusChip(t)}</td><td><button class="link" data-act="openTest" data-id="${esc(t.id)}">Open</button></td></tr>`).join('');
  return `<section class="card"><h2>NWEA and DRA windows</h2>${wRows ? `<div class="tw"><table style="min-width:520px"><thead><tr><th>Window</th><th>Dates</th><th>Status</th><th>Results</th></tr></thead><tbody>${wRows}</tbody></table></div>` : '<p class="empty">No windows apply to this grade yet.' + (isAdmin() ? ' Add them on the Testing calendar page.' : '') + '</p>'}
      <div class="small" style="margin-top:8px">Done means a progress entry for that test is dated inside the window.</div></section>
    <section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:2px solid #E3E8EE;margin-bottom:12px"><h2 style="border:0;margin:0;padding:8px 0">Classroom tests and quizzes</h2>${canAddHere() ? '<button class="primary" data-act="addTestFor">+ Add a test</button>' : ''}</div>
      ${tRows ? `<div class="tw"><table style="min-width:520px"><thead><tr><th>Date</th><th>Test</th><th>Where</th><th>Status</th><th></th></tr></thead><tbody>${tRows}</tbody></table></div>` : '<p class="empty">No tests on the calendar for this student yet.</p>'}</section>`;
}

    b.rows.forEach(r => { const s = demo.students.find(x => x.id === r.studentId && !x.archived); if (!s) { skipped++; return; } const lab = isLabelGrade(s.grade); const values = {}; Object.keys(r.values || {}).forEach(k => { const c = (function () { const t = String(r.values[k]).trim(); if (lab) return GRADE_LABELS.includes(t) ? t : ''; const n = parseFloat(t); return isFinite(n) && n >= 0 && n <= 100 ? n : ''; })(); if (c !== '') values[k] = c; }); if (!Object.keys(values).length) { skipped++; return; } const nums = lab ? [] : Object.values(values); demo.records.grades = demo.records.grades.filter(g => !(g.studentId === s.id && g.month === b.month)); demo.records.grades.push({ id:'g' + Date.now() + saved, studentId:s.id, studentName:s.name, gradeLevel:s.grade, month:b.month, kind: lab ? 'label' : 'number', values, average: nums.length ? Math.round(nums.reduce((a, c) => a + c, 0) / nums.length * 10) / 10 : null, uploadedAt:new Date().toISOString() }); saved++; });
    if (!saved) return err('None of those rows had usable grades'); return ok({ saved, skipped });
  }
  if (action === 'deleteGradeMonth') { const n = demo.records.grades.length; demo.records.grades = demo.records.grades.filter(g => g.month !== b.month); return ok({ removed: n - demo.records.grades.length }); }
  if (action === 'saveWindow') {
    const w = b.window; if (!['NWEA','DRA'].includes(w.measure)) return err('Choose NWEA or DRA'); if (!w.start || !w.end) return err('Choose start and end dates'); if (w.end < w.start) return err('The end date is before the start date');
    const old = w.id ? demo.records.windows.find(x => x.id === w.id) : null;
    const rec = Object.assign(old || { id:'w' + Date.now(), archived:false }, { measure:w.measure, name:w.name || (w.measure + ' window'), start:w.start, end:w.end, grades:(w.grades || []).filter(g => GRADES.includes(g)) });
    if (!old) demo.records.windows.push(rec); return ok({ window:rec });
  }
  if (action === 'archiveWindow') { const w = demo.records.windows.find(x => x.id === b.id); if (w) w.archived = true; return ok(); }
  if (action === 'saveStudent') {
    const i = demo.students.findIndex(s => s.id === b.student.id); const s = Object.assign({ id:'s' + Date.now(), accommodationLog:[], accommodations:[], archived:false }, i >= 0 ? demo.students[i] : {}, b.student);
    if (!s.name) return err('Student name is required'); if (i >= 0) demo.students[i] = s; else demo.students.push(s); return ok({ student:s });
  }
  if (action === 'archiveStudent') { const s = demo.students.find(x => x.id === b.id); if (s) s.archived = true; return ok(); }
  if (action === 'archiveGroup') { demo.groups = demo.groups.filter(g => g.id !== b.id); demo.students.forEach(s => { s.groupIds = s.groupIds.filter(x => x !== b.id); }); return ok(); }
  if (action === 'voidSession') { const x = demo.sessions.find(r => r.id === b.id); if (x) x.voided = true; return ok(); }
  if (action === 'saveSchedule') {
    const sc = b.schedule; if (!sc.name) return err('Schedule name is required');
    for (const bl of sc.blocks) { if (!bl.name || !bl.days.length || !bl.start || !bl.end || bl.end <= bl.start) return err('Check the time blocks: each needs a name, a day, and an end after the start'); }
    const old = sc.id ? demo.schedules.find(x => x.id === sc.id) : null;
    const rec = Object.assign(old || { id:'sc' + Date.now(), archived:false }, { name:sc.name, grades:sc.grades, teacherIds:sc.teacherIds, note:sc.note, blocks:sc.blocks.map((x, i) => Object.assign({ id:'b' + Date.now() + i, where:'' }, x)) });
    if (!old) demo.schedules.push(rec); return ok({ schedule:rec });
  }
  if (action === 'archiveSchedule') { const x = demo.schedules.find(r => r.id === b.id); if (x) x.archived = true; demo.students.forEach(s => { if (s.scheduleId === b.id) s.scheduleId = ''; }); return ok(); }
  if (action === 'saveUser') {
    const u = b.user; if (!u.name) return err('Name is required');
    const code = u.code || (lastName(u.name) + '2627'); const i = demo.users.findIndex(x => x.id === u.id);
    const rec = Object.assign({ id:'u' + Date.now(), active:true }, i >= 0 ? demo.users[i] : {}, { name:u.name, email:u.email, role:u.role, scope:u.role === 'interventionist' ? u.scope : '' }, u.role === 'interventionist' && u.canApprove !== undefined ? { canApprove:!!u.canApprove } : {});
    if (i >= 0) demo.users[i] = rec; else demo.users.push(rec);
    return ok({ user:rec, code: (!u.id || u.code) ? code : null });
  }
  if (action === 'removeUser') { const u = demo.users.find(x => x.id === b.id); if (u) u.active = false; return ok(); }
  if (action === 'getLoginLog') return ok({ logins: demo.logins });
  return err('Unknown action');
}

/* ---------- start ---------- */
(async function init() {
  try {
    const saved = JSON.parse(sessionStorage.getItem('elem_session') || 'null');
    if (saved && saved.token && !DEMO) { state.token = saved.token; state.user = saved.user; await loadAll(); return; }
  } catch (e) {}
  render();
})();
</script>
